name: Audit

# Weekly, and on any change to the dependency set: cargo-deny checks advisories, licenses, bans and sources against
# deny.toml, and npm audit checks the app's runtime dependencies. New advisories land without any change here, which
# is why this runs on a schedule rather than only on pull requests.

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - app/package-lock.json
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
