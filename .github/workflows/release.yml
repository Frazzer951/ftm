name: Release

# A v* tag (pushed by `cargo release`, see RELEASE.md) builds every target into a draft release, publishes it once all
# assets are up, then updates the Homebrew cask and attaches an ftm-bin PKGBUILD to the release. Pre-release tags
# (v0.1.0-rc.1) stop short of the tap: the cask is only rendered and uploaded as a workflow artifact. The PKGBUILD goes
# to the AUR only when the repository variable AUR_PUBLISH is "true" (see RELEASE.md).

on:
  push:
    # Nightlies tag themselves v<version>-nightly.<date> through the API; nightly.yml publishes those.
    tags: ["v*", "!v*-nightly.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag matches the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: NOTES.md
      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=false
          case $version in *-*) prerelease=true ;; esac
          # A rerun reuses its draft. A draft just created can be missing from the listing for a while, so take the id
          # from the create call.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
              -f name="FTM $version" -F body=@NOTES.md -F draft=true -F prerelease="$prerelease" --jq .id)
          fi
          [ -n "$id" ] || { echo "::error::no release id for $GITHUB_REF_NAME"; exit 1; }
          echo "draft release $id"
          {
            echo "id=$id"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

  build:
    name: build
    needs: draft
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ needs.draft.outputs.release-id }}

  publish:
    name: publish release
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.draft.outputs.release-id }}
    steps:
      - name: Check every asset is up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[].name')
          echo "$assets"
          missing=0
          for pattern in '_aarch64\.dmg$' '_x64\.dmg$' '_amd64\.deb$' '_arm64\.deb$' '\.x86_64\.rpm$' '\.aarch64\.rpm$'; do
            grep -qE "$pattern" <<<"$assets" || { echo "::error::no asset matches $pattern"; missing=1; }
          done
          exit $missing
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq .html_url

  homebrew:
    name: homebrew cask
    needs: [draft, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render Casks/ftm.rb
        run: |
          mkdir -p out
          scripts/render-package.sh cask packaging/homebrew/ftm.rb \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" FTM "$VERSION" >out/ftm.rb
          cat out/ftm.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-cask
          path: out/ftm.rb
      - name: Push to Frazzer951/homebrew-ftm
        if: needs.draft.outputs.prerelease == 'false'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:$TOKEN@github.com/Frazzer951/homebrew-ftm.git" tap
          mkdir -p tap/Casks
          cp out/ftm.rb tap/Casks/ftm.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ftm.rb
          if git diff --cached --quiet; then echo "cask already at $VERSION"; exit 0; fi
          git commit -m "ftm $VERSION"
          # The nightly built from this release's version-bump commit may push to the tap at the same time; it only
          # ever touches Casks/ftm@nightly.rb.
          for attempt in 1 2 3; do
            git push origin HEAD && exit 0
            echo "push $attempt refused, rebasing"
            sleep $((attempt * 5))
            git pull --rebase origin "$(git branch --show-current)"
          done
          exit 1

  aur:
    name: aur ftm-bin
    needs: [draft, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render PKGBUILD
        run: |
          mkdir -p out
          scripts/render-package.sh pkgbuild packaging/aur/ftm-bin/PKGBUILD \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" FTM "$VERSION" LICENSE >out/PKGBUILD
          cat out/PKGBUILD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-pkgbuild
          path: out/PKGBUILD
      # Workflow artifacts need a GitHub login to download; release assets don't.
      - name: Attach the PKGBUILD to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/PKGBUILD --clobber -R "$GITHUB_REPOSITORY"
      # Regenerates .SRCINFO from the PKGBUILD in an Arch container before pushing.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: needs.draft.outputs.prerelease == 'false' && vars.AUR_PUBLISH == 'true'
        with:
          pkgname: ftm-bin
          pkgbuild: out/PKGBUILD
          commit_username: Luke Eltiste
          commit_email: luke343279@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ftm-bin ${{ needs.draft.outputs.version }}
