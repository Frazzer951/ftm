version: 2

# The Tauri CLI fails a build when the tauri crates and @tauri-apps/* packages
# drift apart, so each ecosystem has a "tauri" group. Merge the cargo and npm
# Tauri PRs together.

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      tauri:
        patterns:
          - tauri
          - tauri-build
          - tauri-plugin-*
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
