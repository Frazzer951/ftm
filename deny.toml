# cargo-deny: run by .github/workflows/audit.yml weekly. Locally: cargo deny check

[graph]
all-features = true

[advisories]
# Unmaintained crates deep in the Tauri tree are common and not ours to replace; flag only those we depend on directly.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses that can ship inside an MIT-licensed binary. MPL-2.0 is file-level copyleft (cssparser and
# selectors, through Tauri's HTML parsing); we don't modify those files.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# Tauri pulls in several majors of windows-sys, toml, etc.; duplicates are noise here.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
