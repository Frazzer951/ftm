# git-cliff config. FTM's commits are `type(scope): summary` ("feat(app): ...", "fix(ftmd): ..."); older ones name the
# component as a prefix instead ("ftmd: ...", "App: ..."). The changelog groups by that scope or prefix.

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = "<!-- generated by git-cliff -->\n"

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/Frazzer951/ftm/pull/${1}))" },
]
# The <!-- n --> prefixes order the groups and are stripped from the headings.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^(?i)(ftmd[,:]|[a-z]+\\((ftmd|worktree)\\)!?:)", group = "<!-- 0 -->Daemon" },
  { message = "^(?i)(ftm[,:]|[a-z]+\\(cli\\)!?:)", group = "<!-- 1 -->CLI" },
  { message = "^(?i)((app|settings|sidebar|themes|sounds)[,:]|[a-z]+\\((app|settings|sidebar|themes|sounds)\\)!?:)", group = "<!-- 2 -->App" },
  { message = "^(?i)((scripts|scripts/[^:]+|dev\\.sh|install\\.sh)[,:]|[a-z]+\\((scripts|scripts/[^)]+|dev\\.sh|install\\.sh)\\)!?:)", group = "<!-- 3 -->Scripts" },
  { message = "^(?i)((docs|readme)[,:]|docs(\\([^)]*\\))?!?:)", group = "<!-- 4 -->Docs" },
  { message = "^(?i)((ci|release)[,:]|ci(\\([^)]*\\))?!?:|[a-z]+\\((release|packaging|nightly)\\)!?:)", group = "<!-- 5 -->CI and releases" },
  { message = ".*", group = "<!-- 6 -->Other" },
]
filter_commits = false
# Releases and their rc/alpha/beta pre-releases only: nightly tags (v0.1.1-nightly.20261014) must not split the notes.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta|rc)\\.[0-9]+)?$"
topo_order = false
sort_commits = "oldest"
