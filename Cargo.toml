[workspace]
members = ["app/src-tauri", "crates/ftm-core", "crates/ftm", "crates/ftmd"]
resolver = "3"

[workspace.package]
authors = ["Luke Eltiste"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Frazzer951/ftm"
publish = false
version = "0.0.0"

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
publish = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore(release): prepare for release {{version}}"
