[workspace]
members = ["app/src-tauri", "crates/ftm-core", "crates/ftm", "crates/ftmd"]
resolver = "3"

[workspace.package]
authors = ["Luke Eltiste"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Frazzer951/ftm"
# The locked tauri needs 1.90 (ftm, ftmd and ftm-core alone build on 1.89).
rust-version = "1.90"
publish = false
version = "0.1.15"

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
publish = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore(release): prepare for release {{version}}"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
borrow_as_ptr = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
implicit_clone = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
