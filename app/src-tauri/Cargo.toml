[package]
name = "ftm-app"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ftm-core = { version = "0.1.17", path = "../../crates/ftm-core" }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.54.1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22.0.0"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSException", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebViewConfiguration"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSResponder", "NSWindow"] }
# 0.37.2 is the first tao whose `sendEvent:` override is `extern "C-unwind"`; this also keeps the lockfile from going back.
tao = { version = "0.37.2", default-features = false }

# Runs NSApplication on the main thread, which the libtest harness doesn't.
[[test]]
name = "send_event_exceptions"
harness = false

# Once per release, not once per crate.
[package.metadata.release]
pre-release-hook = ["../../scripts/release.sh", "{{version}}"]

[lints]
workspace = true
