<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FTM</title>
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <span>Workspaces</span>
        <span class="actions"><button id="open-settings" title="Settings">⚙</button><button id="add" title="New workspace">+</button></span>
      </header>
      <div id="sections"></div>
    </aside>
    <main>
      <nav id="tabs"></nav>
      <section id="panes"></section>
    </main>
    <div id="parking"></div>
    <dialog id="spawn">
      <form method="dialog" id="spawn-form">
        <h3>New workspace</h3>
        <label><input type="radio" name="kind" value="terminal" checked /> Terminal</label>
        <label><input type="radio" name="kind" value="agent" /> Agent</label>
        <div class="row"><button type="button" id="pick">Browse…</button><span id="folder">none</span></div>
        <div id="recent"></div>
        <label>Name <input name="name" placeholder="auto from task (agents), else folder or branch" /></label>
        <fieldset id="git" hidden>
          <label><input type="checkbox" name="worktree" /> New worktree</label>
          <label>Branch <input name="branch" /></label>
          <label>Base <input name="base" placeholder="repo default" /></label>
          <label><input type="checkbox" name="copy" /> Copy my changes</label>
        </fieldset>
        <p id="spawn-error"></p>
        <div class="row">
          <button value="cancel" formnovalidate>Cancel</button>
          <button id="create" value="create">Create</button>
        </div>
      </form>
    </dialog>
    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h3>Settings</h3>
        <label>Font family <input name="font_family" list="font-suggestions" /></label>
        <datalist id="font-suggestions">
          <option value="FiraCode Nerd Font Mono"></option>
          <option value="FiraCode Nerd Font"></option>
          <option value="Fira Code"></option>
          <option value="JetBrains Mono"></option>
          <option value="Menlo"></option>
          <option value="SF Mono"></option>
          <option value="DejaVu Sans Mono"></option>
        </datalist>
        <p id="font-hint" class="hint"></p>
        <label>Font size <input name="font_size" type="number" min="6" max="40" step="0.5" /></label>
        <label>Line height <input name="line_height" type="number" min="0.8" max="2" step="0.05" /></label>
        <label><input type="checkbox" name="ligatures" /> Ligatures (=&gt; != -&gt; === and the like)</label>
        <p id="settings-error"></p>
        <div class="row">
          <button value="cancel" formnovalidate>Cancel</button>
          <button id="save-settings" value="save">Save</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
